<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - Biblioteca</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>📚 Biblioteca</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="libros.html">Libros</a></li>
                <li><a href="autores.html">Autores</a></li>
                <li><a href="categorias.html" class="active">Categorías</a></li>
                <li><a href="socios.html">Socios</a></li>
                <li><a href="prestamos.html">Préstamos</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Categorías</h2>
        <div id="message"></div>
        <div class="toolbar"><button class="btn" onclick="showForm()">+ Nueva Categoría</button></div>
        <div id="loading" class="loading">Cargando...</div>
        <table id="table" style="display:none">
            <thead><tr><th>ID</th><th>Nombre</th><th>Acciones</th></tr></thead>
            <tbody id="tbody"></tbody>
        </table>
    </main>
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Nueva Categoría</h2>
            <form id="form" onsubmit="save(event)">
                <input type="hidden" id="id">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-success">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    <footer><p>Sistema de Gestión de Biblioteca</p></footer>
    <script type="module">
        import { bindTableActions, escapeHtml, get, post, put, del } from './js/api.js';
        window.renderList = async function() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('table').style.display = 'none';
            try {
                const data = await get('/api/categorias');
                const tbody = document.getElementById('tbody');
                tbody.innerHTML = '';
                data.forEach(c => {
                    tbody.innerHTML += `<tr><td>${escapeHtml(c.id)}</td><td>${escapeHtml(c.nombre)}</td>
                        <td><button class="btn" data-action="edit" data-id="${escapeHtml(c.id)}">Editar</button>
                        <button class="btn btn-danger" data-action="remove" data-id="${escapeHtml(c.id)}">Borrar</button></td></tr>`;
                });
                document.getElementById('table').style.display = 'table';
            } catch (e) { showMessage(e.message, 'error'); }
            finally { document.getElementById('loading').style.display = 'none'; }
        };
        window.showForm = function() {
            document.getElementById('modalTitle').textContent = 'Nueva Categoría';
            document.getElementById('form').reset();
            document.getElementById('id').value = '';
            document.getElementById('modal').classList.add('active');
        };
        window.edit = async function(id) {
            try {
                const c = await get(`/api/categorias/${id}`);
                document.getElementById('modalTitle').textContent = 'Editar Categoría';
                document.getElementById('id').value = c.id;
                document.getElementById('nombre').value = c.nombre;
                document.getElementById('modal').classList.add('active');
            } catch (e) { showMessage(e.message, 'error'); }
        };
        window.save = async function(e) {
            e.preventDefault();
            const id = document.getElementById('id').value;
            const body = { nombre: document.getElementById('nombre').value };
            try {
                if (id) await put(`/api/categorias/${id}`, body);
                else await post('/api/categorias', body);
                closeModal();
                showMessage(id ? 'Categoría actualizada' : 'Categoría creada', 'success');
                window.renderList();
            } catch (err) { showMessage(err.message, 'error'); }
        };
        window.remove = async function(id) {
            if (!confirm('¿Está seguro de borrar esta categoría?')) return;
            try { await del(`/api/categorias/${id}`); showMessage('Categoría eliminada', 'success'); window.renderList(); }
            catch (e) { showMessage(e.message, 'error'); }
        };
        window.closeModal = function() { document.getElementById('modal').classList.remove('active'); };
        window.showMessage = function(msg, type) {
            const el = document.getElementById('message');
            el.innerHTML = `<div class="message ${escapeHtml(type)}">${escapeHtml(msg)}</div>`;
            setTimeout(() => el.innerHTML = '', 3000);
        };
        bindTableActions(document.getElementById('tbody'), {
            edit: id => window.edit(id),
            remove: id => window.remove(id)
        });
        window.renderList();
    </script>
</body>
</html>
